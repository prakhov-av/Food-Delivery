server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие на самом origin: Cloudflare жмёт brotli, но и без него
    # ответы должны уходить сжатыми.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Файлы сборки с хешем в имени никогда не меняются — кэшируем их надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html всегда свежий, иначе после деплоя останется старый бандл.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
